        DESCRIBED IN THE SECTION ENTITLED "YOUR PRIVACY RIGHTS."
    sections:
      - title: 1. Changes in Privacy Policy
        paragraphs:
          - Any Personal Information that we collect and maintain will be
            subject to this Privacy Policy, as amended from time to time. We may
            change the Privacy Policy at our sole discretion. However, if at any
            time we make material changes to the Privacy Policy, we will notify
            you of those changes on the Platform or through the Services and
            through the publishing of an updated Privacy Policy. If as the
            result of such changes you want to alter the ways in which we can
            use your Personal Information, you can do so by following the
            procedure described in the section entitled "Your Privacy Rights."
      - title: 2. Collection of Information
        paragraphs:
          - "We may collect certain information from you when you use our
            Services. We collect and obtain your information in a few ways:
            there is information that you choose to give to us, information we
            obtain through your use of our Services, and information we obtain
            from third parties."
        listItems:
          - We collect the Personal Information you choose to give us when you
            use the Services, including your name, e-mail address, physical
            address, telephone number, and the like.
          - We automatically collect certain kinds of non-personal information
            from you when you use the Services, including device, browser type,
            operating system, CPU speed, referring or exit webpages, click
            patterns, session ID, and your computer's IP address.
          - We may on occasion supplement or correct the Personal Information
            you submit to us and your IP address with information in our other
            databases or information from third-party sources in order to reduce
            errors in our database, authenticate our users, prevent fraud, and
            prevent abuse of our Services, as well as to provide more
            consistent, relevant experiences to our users.
          - We may collect general information about use of the Services, such
            as what pages visitors access, the number of visits, average time
            spent on the Services, and other similar factors. This information
            is generally collected in aggregate form, without identifying any
            user individually, although IP addresses and Session ID in relation
            to downloads may be tracked as part of our fraud prevention efforts.
      - title: 3. Location-Based Services
        paragraphs:
          - Some Services may contain functionality that can enable us to access
            your location and tailor your experience based on your location
            ("Location-based Services"). To use Location-based Services, you
            must enable certain features of your mobile device (e.g., GPS,
            Wi-Fi, or Bluetooth) to allow us to identify your location. To the
            extent your location is collected through Wi-Fi or Bluetooth
            sensors, such sensors, and the associated data services, may be
            provided by a third party that may access such information for the
            purpose of providing such data services to us. You agree to such
            access by such third parties. You may enable or disable such
            Location-based Services at any time via a menu within the Services.
            If you choose to disable any Location-based Services on your device
            and/or opt out of any Location-based Services through the menu, you
            will not be able to utilize certain features of the Services. By
            enabling Location-based Services on your device, you agree and
            acknowledge that (i) device data we collect from you is directly
            relevant to your use of the Services; (ii) we may provide
            Location-based Services related to and based on your then-current
            location; and (iii) we may use any such information collected in
            connection with the provision of Location-based Services in
            providing the Services. PLEASE NOTE THAT LOCATION DATA MAY NOT
            ALWAYS BE ACCURATE, AND WE DISCLAIM ANY AND ALL WARRANTIES RELATED
            TO LOCATION-BASED SERVICES.
          - We may use your location to provide you with advertisements, offers,
            and other promotional content as part of the Services.
      - title: 4. How Your Information is Used
        paragraphs:
          - "Except as provided herein, we collect and use your personal and
            non-personal information for internal purposes only or for gathering
            aggregate and anonymized data. We may use, store, and process your
            information in the following ways:"
        listItems:
          - To enable you to access and use the Services.
          - To conduct routine business operations such as billing,
            identification, authentication, contact purposes and general
            research. As part of our routine business operations, we may
            transfer your Personal Information to certain third parties with
            whom we contract for the limited purpose of providing services such
            as web hosting, email, and credit card processing. These service
            providers are obligated to protect your information, and they do not
            use your Personal Information for their own commercial purposes.
          - To employ internal marketing techniques such as tracking user
            preferences to provide a customized experience and communicating
            with you about Services, special offers, and other services.
          - To enhance the Services.
          - To gather product, location, and other contributed information to
            make reports based on aggregate anonymized data, which we may use
            internally, or which we may sell to others.
          - To comply with court and governmental orders.
          - To fulfill another legitimate interest, when not overridden by your
            interests or, where applicable, your fundamental rights and freedoms
            which require the protection of Personal Information.
          - When you otherwise consent for us to do so. We may ask for your
            consent to process your Personal Information for a specific purpose
            that we communicate to you, for instance, to receive our newsletter
            and other such mailings you may be interested in. When you consent
            to our processing your Personal Information for a specified purpose,
            you may withdraw your consent at any time, and we will stop
            processing of your data for that purpose.
          - The above excludes text messaging originator opt-in data and
            consent; this information will not be shared with any third parties.
      - title: 5. Tracking, Use of Cookies, Web Beacons and Similar Devices
        paragraphs:
          - In order to improve our Services and provide more convenient,
            relevant experiences to our users, we and our agents may use
            "cookies," "web beacons," and similar devices to track your
            activities. A cookie is a small amount of data that is transferred
            to your browser by a web server and can only be read by the server
            that gave it to you. It functions as your identification card and
            enables us to record your passwords and preferences. It cannot be
            executed as code or deliver viruses. A web beacon is a small
            transparent .gif image that is embedded in an HTML page or email
            used to track when the page or email has been viewed. Most browsers
            are initially set to accept cookies, and most services that include
            similar devices are typically initially activated to collect data.
            You can set your browser to notify you when you receive a cookie,
            giving you the chance to decide whether to accept it. We do not
            support browsers' Do Not Track features. You can enable or disable
            Do Not Track by visiting the preferences or settings page of your
            browser. If you disable cookies, you may lose some of the features
            and functionality of using our Platform, as cookies may be necessary
            to track and enhance your use and access.
          - We may, either directly or indirectly, track your behavior on our
            Services for purposes of our own user support, analytics, research,
            product development, fraud prevention, risk assessment, regulatory
            compliance, investigation, as well as to enable you to use and
            access the Services and pay for your activities on the Services. We
            may also, either directly or through third parties we engage to
            provide services to us, track your behavior on our Services.
      - title: 6. Protecting Your Information
        paragraphs:
          - We use a variety of security measures, including SSL, encryption,
            and authentication tools, to help protect your information. We do
            not retain your Personal Information for longer than is necessary
            for our business purposes. When we no longer need your Personal
            Information, we dispose of it safely.
          - Our security measures include standard international data protection
            measures as well as those described in applicable data protection
            regulations. These measures may also include periodic system-wide
            password resets with high password strength requirements. We
            strongly discourage password sharing. Due to the nature of the
            information and related technology, we cannot be held responsible if
            you share your own login credentials with others. If we learn of a
            security breach, then we will immediately reset your account
            password and attempt to notify you to take appropriate steps.
      - title: 7. Data Processing
        paragraphs:
          - In submitting any third-party Personal Data within the context of
            the Services ("Third-Party Data"), the parties agree that you shall
            be the Data Controller and you appoint us as a Data Processor of
            such data, for the purpose of providing the Services. To the extent
            that we are a Data Processor for you in respect of such Third-Party
            Data, we will implement appropriate technical and organizational
            measures to safeguard the Third-Party Data against any unauthorized
            or unlawful access, loss, destruction, theft, use or disclosure.
          - You represent and warrant that you have all the appropriate consents
            from data subjects whose Personal Data are submitted to us in the
            course of the provision of the Services.
      - title: 8. Disclosure to Third Parties
        paragraphs:
          - "We will not share your Personal Information with third parties
            without your express consent, except in the limited circumstances
            described below:"
        listItems:
          - We may share your Personal Information with our affiliates and
            third-party service providers for the limited purposes described in
            the section entitled "How Your Information is Used". However, as
            noted above, this excludes text messaging originator opt-in data and
            consent; this information will not be shared with any third parties.
          - We will share your Personal Information when required by law,
            regulation, or litigation, and as necessary for purposes of national
            security, law enforcement, or other issues of public importance.
          - We may also engage third parties to help verify your identification,
            to conduct checks against databases, to otherwise assist us with
            fraud prevention and risk assessment, to assist us with user
            service, to serve targeted ads, and to facilitate the payments or
            refunds. We may provide Personal Information about you to these
            third parties, or give them access to this Personal Information, for
            the limited purpose of allowing them to provide these services.
          - If we sell assets or are acquired by or merged with another entity,
            we may provide such entity user information without obtaining your
            further consent. We may provide to you notice of such asset sales,
            acquisitions, or mergers.
      - title: 9. International Transfers
        paragraphs:
          - If you are visiting this Platform or utilizing Services from a
            country other than the United States, the various communications you
            send and receive may result in the transfer of information across
            international boundaries. If you are located in the European Union,
            you should be aware that information you provide, or which is
            otherwise collected on this Platform or through any Services
            rendered may be transferred to countries (including the United
            States) which may not have data protection laws deemed as adequate
            as those in the EU.
          - Notwithstanding the foregoing, the Services are intended for users
            in the United States and those not governed by privacy policies of
            other countries. Users outside the United States are advised not to
            disclose Personal Information to us.
      - title: 10. Your Privacy Rights
        paragraphs:
          - "We will ensure that you can exercise your rights pertaining to your
            Personal Information, including rights as provided by various data
            protection laws. We therefore inform you that, where applicable
            under relevant law, you are entitled:"
        listItems:
          - to have access to your Personal Information upon simple request;
          - to obtain a rectification of your Personal Information should it be
            inaccurate, incomplete, or obsolete;
          - to obtain the deletion of your Personal Information in the
            situations set forth by applicable data protection law (the "right
            to be forgotten");
          - "to withdraw your consent to the data processing without affecting
            the lawfulness of processing, where your Personal Information has
            been collected and processed based on your consent. If at any time
            you wish to withdraw your consent to our processing of your data or
            opt out of our use of your information for internal marketing
            purposes or for compiling aggregate risk reports, you may do so by
            sending a written notice to: SyncereTattoobooking@gmail.com. Note
            that your withdrawal of consent may prevent us from providing the
            Services to you;"
          - to object to the processing of your Personal Information in which
            case we may ask you to justify your request by explaining to us your
            situation;
          - to request a limitation of the data processing in the situations set
            forth by applicable law;
          - for non-discrimination, as defined under relevant law, in the
            Services or quality of Services you receive from us for exercising
            your rights.
      - title: 11. Your Choices
        listItems:
          - If at any time you are uncomfortable with our use of your Personal
            Information for internal marketing purposes and for the purpose of
            creating aggregate reports, you may opt-out by email as described in
            "Your Privacy Rights." Note that if you opt not to provide us with
            certain mandatory information, then our products and services may be
            unavailable to you.
          - You may similarly opt out of receiving communications from us,
            although we may find it necessary to continue to communicate with
            you regarding your use of the Services.
          - For our websites, you may set your browser to refuse all or some
            browser cookies, or to alert you when cookies are being sent. If you
            disable or refuse cookies, please note that some parts of this
            Platform may then be inaccessible or not function properly.
      - title: 12. Governing Law
        paragraphs:
          - The terms of this Privacy Policy are governed by and in accordance
            with the laws of the State of New Mexico, and, where applicable, the
            laws of the countries where our servers are located. You should not
            provide us with any Personal Information unless you consent to the
            application of United States law and, where applicable, New Mexico
            law, and to the use and disclosure of your information in accordance
            with the terms of this Privacy Policy.
      - title: 13. How to Contact Us
        paragraphs:
          - "If you have any questions regarding this Policy or our privacy
            practices, you can contact us at:"
          - |-
            Syncere Tattoo
            Address: 1900 S. Espina St #5, Las Cruces, NM 88001
            Telephone: (575) 524-0190
            Email: SyncereTattoobooking@gmail.com
          - We take our users' privacy concerns seriously. If you believe that
            we have not complied with this Privacy Policy with respect to your
            Personal Information, you may write to us at the address noted
            above.
