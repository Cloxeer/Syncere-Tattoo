story:
  title: OUR STORY
  paragraphs:
    - Syncere Tattoo has been part of the Las Cruces community for over a decade
      — one of the longest-running studios in the city. What started as owner
      Diane Basler-White's passion for tattooing in 2004 grew into a
      state-licensed shop built on custom work, cleanliness, and a welcoming
      chair.
    - From fine line and florals to black and gray realism, our artists cover a
      range of styles and collaborate with every client to refine a design that
      fits. Whether it's your first tattoo or your twentieth, we take the time
      to get it right.
    - We've tattooed locals, travelers passing through southern New Mexico, and
      clients who found us through word of mouth and Instagram. The studio on
      Espina Street is where that work happens — a creative space rooted in Las
      Cruces and open to anyone ready for their next piece.
    - Book through synceretattoo@gmail.com, call (575) 524-0190, or follow
      @synceretattoo_nm to see fresh work from Diane, Ori, Stephanie, and Mike.
      We're here when you're ready.
