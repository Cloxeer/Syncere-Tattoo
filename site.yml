artists:
  - slug: diane-basler-white
    name: DIANE BASLER-WHITE
    role: Owner
    specialty: Fine line, mandalas, dot work, black & grey realism, and traditional.
    bio: <strong>Diane Basler-White</strong> owns Syncere Tattoo — named after her
      daughter — which she opened in 2007, the oldest studio in Las Cruces. A
      lifelong, self-taught artist, she works across many styles and has built a
      welcoming, inclusive shop focused on quality and pieces personal to each
      client.
    galleryUrl: https://www.instagram.com/diane_synceretattoo/
    image: /images/DianeBaslerWhite.jpg
    galleryImages:
      - /images/diane-1.png
      - /images/diane-2.jpg
      - /images/diane-3.jpg
      - /images/diane-4.jpg
      - /images/diane-5.jpg
    fullBioTitle: Diane's Biography
    fullBio:
      - My name is Diane Basler-White, and I am the proud owner of Syncere
        Tattoo, named after my daughter. I opened the shop in 2007, and it is
        currently the oldest tattoo studio in Las Cruces.
      - I've been an artist for as long as I can remember—probably since the
        moment I learned how to hold a pencil. Colored pencils and airbrush have
        always been two of my favorite mediums, although I've explored just
        about every form of art over the years. Growing up, art was my outlet
        and the one thing that helped me stay focused and enjoy school. I never
        imagined it would eventually become my career.
      - I began tattooing at a time when the industry was very different. There
        was no social media, Google, or easy access to information. Tattooing
        was still a very private and coveted craft and very difficult to enter
        into.
      - After getting my first tattoo, I remember asking my artist how someone
        got started in tattooing. Not long after, I was offered an
        apprenticeship after an admittedly terrible attempt at tattooing my
        little sister! The artist who fixed it happened to be looking for a
        female artist and gave me an opportunity. Unfortunately, I wasn't able
        to complete the apprenticeship because I had my daughter prematurely,
        but I continued practicing and eventually earned my first job as a
        tattoo artist. Those early opportunities became the foundation of my
        career.
      - Because I started in a traditional, flash-based shop, I had the
        opportunity to learn and practice many different styles. That experience
        helped me become a very versatile artist. Today, I enjoy everything from
        fine lines and intricate micro tattoos to detailed mandalas, geometric
        and dot work, cover-ups, and bold color. I also love black and grey
        realism, portraits, animal portraits, and traditional tattooing.
      - After only a couple of years of tattooing, I took a leap and opened my
        own shop in the back of a clothing store. That location lasted only
        three months before I opened my first “real” studio. Looking back, I was
        probably either incredibly brave or completely naïve to start my own
        business so early in my career—but it ended up being one of the best
        decisions I've ever made.
      - "Over the years, owning a shop has come with plenty of challenges,
        learning curves, and growth. More importantly, it gave me the
        opportunity to create the kind of environment I wanted: welcoming,
        inclusive, safe, comfortable, and focused on quality work."
      - I'm incredibly proud to say that I've built that environment at Syncere
        Tattoo. I've surrounded myself with talented artists who are not only
        passionate about their craft, but are genuinely wonderful people.
        Creating a space where everyone feels comfortable and respected is just
        as important to me as the quality of the artwork.
      - I believe tattoos should feel personal and unique to the person wearing
        them. I love working with my clients through communication, ideas, and
        direction to create something that is truly their own.
      - I also believe choosing the right artist is incredibly important. Style,
        experience, personality, comfort, and compatibility all play a role—you
        can spend many hours with your tattoo artist, so finding the right fit
        matters. Taking the time to review portfolios and have an initial
        consultation can help ensure you've found the right artist for your
        project.
      - Over the years, I've attended conventions and seminars, continued my
        education, and constantly pushed myself to improve. Quality work and the
        experience my clients have while getting tattooed are my two biggest
        priorities.
      - One of the things I love most about tattooing is the community it has
        created in my life. I'm grateful that after all these years, this career
        is still largely built on relationships, referrals, and word of mouth.
      - Whether you're a longtime client, a returning client, or someone who was
        referred to us for the first time, I'm excited to help create a piece of
        art that you'll hopefully love for a lifetime.
  - slug: ori-reyes
    name: ORI REYES
    specialty: Custom black & grey — floral, gothic, and nature-inspired.
    bio: <strong>Ori</strong> has tattooed since 2011, specializing in custom black
      & grey work inspired by nature, dark aesthetics, and elegant linework. She
      creates clean, timeless, deeply personal pieces and makes every client
      feel heard and comfortable from start to finish.
    galleryUrl: https://www.instagram.com/inkbyori/
    image: /images/OriReyes.jpg
    galleryImages:
      - /images/ori-5.jpg
      - /images/ori-2.jpg
      - /images/ori-3.jpg
      - /images/ori-4.jpg
      - /images/ori-1.jpg
    fullBioTitle: Ori's Biography
    fullBio:
      - Hi, I'm Ori Reyes, a tattoo artist at Syncere Tattoo in Las Cruces, New
        Mexico. I've been tattooing since 2011. I specialize in custom black and
        grey work, and I'm passionate about creating clean, timeless tattoos
        that are both beautiful and deeply personal. Every piece is approached
        with the goal of giving clients artwork they'll be proud to wear for a
        lifetime.
      - Art has always been a central part of my life, and tattooing became the
        perfect way to combine creativity with meaningful human connection. I
        love transforming ideas into custom designs that tell a story, whether
        it's a floral piece, a bold gothic concept, or an original custom
        tattoo.
      - My style is heavily inspired by nature, dark aesthetics, and elegant
        linework. I especially enjoy creating custom flash pieces, from the
        weird and unusual to the simple and delicate.
      - I believe in making a connection with each client to ensure they feel
        heard, comfortable, and confident throughout the entire process.
        Creating a relaxed, welcoming, and safe experience is just as important
        to me as giving you artwork you'll love forever.
      - When I'm not tattooing, I enjoy creating new artwork, exploring creative
        projects, and spending time with my family. I'm always looking for ways
        to grow as an artist and as a person.
      - Whether you're planning your very first tattoo or adding to an existing
        collection, I'd love to help bring your vision to life with a custom
        piece that's uniquely yours.
  - slug: stephanie-avila
    name: STEPHANIE AVILA
    specialty: Black & grey realism and custom, meaningful work.
    bio: <strong>Stephanie</strong> has tattooed since 2020, after leaving a path in
      the medical field to pursue the art she'd always loved. She specializes in
      black & grey realism and makes every client — first tattoo or fiftieth —
      feel safe, comfortable, and heard.
    galleryUrl: https://www.instagram.com/avilainkk/
    image: /images/d1f0b517-c3a9-4fa0-9fad-25c910047ec5-1786643736678.jpg
    galleryImages:
      - /images/steph-4.jpg
      - /images/steph-2.jpg
      - /images/steph-3.jpg
      - /images/steph-1.jpg
      - /images/steph-5.jpg
    fullBioTitle: Stephanie's Biography
    fullBio:
      - Hi, I'm Stephanie, a tattoo artist at Syncere Tattoo in Las Cruces, New
        Mexico, specializing in black and grey realism. I've been tattooing
        professionally since 2020.
      - Before pursuing tattooing, I was working toward a career in the medical
        field. After dedicating years to my education, I eventually realized
        that my true passion had always been art.
      - Drawing has been a part of my life for as long as I can remember. What
        started as a hobby eventually became something I couldn't imagine living
        without. Choosing to turn that passion into a career has been one of the
        most rewarding decisions I've ever made.
      - Today, I'm grateful to create meaningful, custom tattoos for the people
        who trust me with their stories. To me, tattooing is about much more
        than creating beautiful artwork—it's about making someone's day better
        than when they walked through the door. Every person who sits in my
        chair is placing their confidence in me, and I believe it's my
        responsibility to create an environment where they feel safe,
        comfortable, respected, and genuinely heard.
      - Whether it's your first tattoo or your fiftieth, I want every
        appointment to be a positive experience where you can relax, be
        yourself, and leave feeling proud of what we've created together.
      - Being able to express my creativity and connect with the world around me
        is what continues to motivate me. Tattooing has taught me patience,
        discipline, and the importance of continuous growth. Those lessons
        continue to shape the way I approach every tattoo and every person I
        work with.
      - What makes tattooing especially meaningful to me is the way it allows
        art to become deeply personal. Every design can represent a story, a
        memory, a milestone, a loved one, or a moment that holds special
        meaning. Being trusted to transform those experiences into something
        permanent is a privilege I never take for granted.
      - Knowing that my work can help someone celebrate a loved one, honor an
        important life experience, or simply feel more confident in their own
        skin is what inspires me every day. I'm grateful to be able to turn
        something I've loved my entire life into art that people can carry with
        them for a lifetime.
  - slug: mike
    name: MIKE
    specialty: High-contrast black & grey realism, horror, script, and traditional.
    bio: <strong>Michael “Mike” Aguirre</strong> has tattooed since 2021,
      specializing in high-contrast black & grey realism, horror, script, and
      religious work. CPR certified, he creates custom, original pieces through
      honest communication — meaningful art built to last a lifetime.
    galleryUrl: https://www.instagram.com/_madmik3_/
    image: /images/Mike.jpg
    galleryImages:
      - /images/mikey-3.jpg
      - /images/mikey-2.jpg
      - /images/mikey-1.jpg
      - /images/mikey-4.jpg
      - /images/mikey-5.jpg
    fullBioTitle: Mike's Biography
    fullBio:
      - Hi, my name is Michael Aguirre, a tattoo artist from Las Cruces, New
        Mexico, at Syncere Tattoo. I've been tattooing since 2021, specializing
        in high-contrast black and grey realism, horror tattoos, script,
        American Traditional, and religious/abstract tattoos. My goal is to live
        my dream by creating permanent, high-quality, meaningful art that lasts
        a lifetime and is appreciated by those who understand and respect the
        craft.
      - Tattoos have been a part of my life for a long time, and I've always
        been artistic. I've spent years drawing, painting, working with all
        kinds of different mediums, and taking art classes throughout my school
        years. I completed a two-year apprenticeship and have been tattooing
        professionally for a total of four years. I love tattooing because it's
        a beautiful form of self-expression—an exchange of energy, connection,
        and trust. It's such a unique craft, and I love creating meaningful
        pieces and bringing people's ideas to life.
      - I especially enjoy doing high-contrast black and grey realism,
        religious, and horror pieces. I love horror movies, religious artwork,
        and high-contrast art, all of which are reflected in my work. I prefer
        creating custom designs to ensure every tattoo is original and unique to
        each client.
      - Having good communication with my clients is very important to me. I
        believe it's essential to gather all the information and details needed
        to truly bring my clients' visions to life. I'm always transparent and
        honest because I respect every client who trusts me with their ideas.
        Designing something so meaningful shouldn't be rushed or thrown
        together. Here, we focus on creating a welcoming, safe, and comfortable
        environment for everyone.
      - I have four years of experience working in a professional tattoo shop
        and am CPR certified.
      - Outside of tattooing, I enjoy spending time with my family and my two
        cats. I'm a homebody, so I enjoy playing video games, cooking, watching
        movies, painting, and engraving mirrors.
      - I'm always accepting new clients, whether it's your very first tattoo or
        you're adding another piece to your canvas. I'd truly enjoy the
        privilege of helping bring your ideas to life through artwork that
        you'll wear and cherish forever.
