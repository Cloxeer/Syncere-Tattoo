    attribution: Matt Braddock — Google
faq:
  - question: How do I book an appointment?
    answer: Call us at (575) 524-0190, email SyncereTattoobooking@gmail.com, or
      message us on Instagram @synceretattoo_nm. Share your idea, any reference
      images, preferred placement, and available dates so we can match you with
      the right artist and get you scheduled.
  - question: HOW OLD DO I HAVE TO BE TO GET A TATTOO?
    answer: You must be at least 18 years of age. It is against New Mexico law to
      tattoo a minor, even with parental consent. Every client must present a
      valid state or federal photo ID — no exceptions.
  - question: HOW MUCH DOES A TATTOO COST?
    answer: Pricing depends on the artist, size, detail, and placement. We offer
      free consultations to give you an accurate estimate before you commit.
      Reach out with your idea and we'll walk you through options.
  - question: How can I get a price quote?
    answer: The best way is a consultation — in person at the studio or by email
      with reference photos and a description of size, placement, and detail.
      We're happy to answer questions and help you plan your piece.
  - question: Do you take walk-ins?
    answer: Appointments are recommended. Call (575) 524-0190 to check same-day
      availability. We'll do our best to accommodate you when the schedule
      allows.
  - question: Text or call us!
    answer: (575) 524-0190 — the fastest way to reach Syncere Tattoo.
  - question: Does it hurt?
    answer: Yes — but most clients describe it as manageable. Eat beforehand, stay
      hydrated, and let your artist know if you need a break. We're here to keep
      you comfortable.
  - question: HOW LONG DOES A TATTOO TAKE TO HEAL?
    answer: Surface healing typically takes two to three weeks. Full skin
      regeneration can take several months. We'll send you home with aftercare
      instructions tailored to your piece.
  - question: HOW DO I CARE FOR MY NEW TATTOO?
    answer: Follow the aftercare card your artist provides. Keep it clean,
      moisturize as directed, avoid sun and soaking until healed, and reach out
      if you have any concerns during healing.
  - question: WHAT FORMS OF PAYMENT ARE ACCEPTED?
    answer: We accept cash and major credit cards. Contact us if you have questions
      about payment before your appointment.
  - question: Do I need to leave a deposit?
    answer: A deposit is required to hold your appointment. Deposits are applied to
      your final session and are non-refundable if you cancel without sufficient
      notice. Ask when you book for current policy details.
  - question: HOW SHOULD I PREPARE FOR MY TATTOO?
    answer: Eat a solid meal, drink water, and get good rest the night before. Avoid
      alcohol for 24 hours — it can increase bleeding and affect healing. Wear
      comfortable clothing that gives easy access to the area being tattooed.
  - question: Where are you located?
    answer: "1900 S. Espina St #5, Las Cruces, New Mexico 88001. We're open Tuesday
      through Friday 10AM–6PM and Saturday 10AM–4PM. Closed Sunday and Monday."
