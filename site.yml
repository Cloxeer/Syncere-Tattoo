legal:
  accessibility:
    title: Accessibility Statement
    subtitle: Syncere Tattoo Accessibility Statement
    lastUpdated: December 2024
    sections:
      - title: General
        paragraphs:
          - Syncere Tattoo strives to ensure that its services are accessible to
            people with disabilities. We have invested significant resources to
            help ensure that our website is easier to use and more accessible
            for people with disabilities, with the strong belief that every
            person has the right to live with dignity, equality, comfort, and
            independence.
      - title: Accessibility
        paragraphs:
          - We have taken measures to add custom coding to our site to improve
            accessibility and compliance with the Web Content Accessibility
            Guidelines (WCAG 2.1). We continue to review our site and update
            content, structure, and styling to improve the experience for all
            visitors, including those using assistive technologies.
      - title: Disclaimer
        paragraphs:
          - Syncere Tattoo continues its efforts to constantly improve the
            accessibility of its site and services in the belief that it is our
            collective moral obligation to allow seamless, accessible, and
            unhindered use for those of us with disabilities.
          - Despite our efforts to make all pages and content on our website
            fully accessible, some content may not yet have been fully adapted
            to the strictest accessibility standards. This may be a result of
            not having found or identified the most appropriate technological
            solution.
      - title: Here For You
        paragraphs:
          - If you are experiencing difficulty with any content on our website
            or require assistance with any part of our site, please contact us
            during normal business hours as detailed on our homepage and we will
            be happy to assist.
      - title: Contact Us
        paragraphs:
          - "If you wish to report an accessibility issue, have any questions,
            or need assistance, please contact Syncere Tattoo customer support
            as follows:"
          - "Email: SyncereTattoobooking@gmail.com"
          - "Phone: (575) 524-0190"
          - "Address: 1900 S. Espina St #5, Las Cruces, NM 88001"
  privacyPolicy:
    title: Privacy Policy
    subtitle: Syncere Tattoo Privacy Policy
    lastUpdated: December 21, 2024
    intro:
      - Syncere Tattoo ("Syncere", "we", or "us") values our users and respects
        their privacy. This privacy policy ("Privacy Policy") governs our
        collection and use of data in connection with our Services (as such term
        is defined in our Terms of Service), or otherwise. Terms capitalized but
        not defined in this Privacy Policy shall have the meaning ascribed to
        them in our Terms of Service ("Terms") located at
        https://synceretattoo.com/terms-of-service.
      - This Privacy Policy sets forth the nature, purpose, use, and sharing of
        any Personal Information. "Personal Information" or "Personal Data" as
        used in this Privacy Policy means information that can be used on its
        own or with other information to identify, contact, or locate you, or to
        identify you in context. This includes your name, physical address,
        email address, telephone number, payment card information, account
        username, and other identifying information. It also includes other
        information that may be associated with your Personal Information, such
        as your location, IP address, preferences, or interests.
      - Importantly, we may collect Personal Information directly from you when
        you visit our Platform or access and use our Services.
      - This Privacy Policy does not govern privacy practices of associated
        websites or online services other than ours, or practices of third
        parties that we do not own or control, such as our partners or
        third-party service providers featured on the Services. We are not
        responsible for the content or privacy practices of third-party websites
        or integrated products to which the Services may link. You should review
        the privacy policies of such sites before using them.
      - Please read this Privacy Policy carefully so that you have a clear
        understanding of how we collect, use, otherwise handle, and protect your
        Personal Information in connection with your use of the Services. IF YOU
        HAVE OBJECTIONS TO THE PRIVACY POLICY, YOU SHOULD IMMEDIATELY
