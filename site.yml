story:
  title: OUR STORY
  paragraphs:
    - Welcome to our tattoo Family - Established in 2007, Syncere Tattoo is the
      oldest tattoo studio in Las Cruces, New Mexico. For nearly two decades,
      we’ve built our reputation on exceptional craftsmanship, professionalism,
      and creating an environment where every client feels comfortable,
      respected, and welcome.
    - At Syncere Tattoo, we believe getting tattooed is more than just an
      appointment — it’s an experience. Whether you’re celebrating a milestone,
      honoring a loved one, or simply bringing an idea to life, we’re committed
      to creating meaningful, high-quality artwork that you’ll be proud to wear
      for a lifetime..
    - Our artists specialize in a wide variety of styles, including black and
      grey realism, high-contrast black and grey, religious and faith-based
      artwork, fine line, script, intricate micro tattoos, American Traditional,
      bold color, geometric designs, mandalas, cover-ups, and fully custom
      pieces. We also love creating the weird, creepy, dark, and horror-inspired
      tattoos that let our clients’ imaginations run wild.
    - >
      You can find a link to each artist portfolio in the profiles below to find
      which artist best suits you.
    - >-
      More than anything, we strive to be a studio where everyone feels at home.
      From your first consultation to the final tattoo, our goal is to provide
      an experience that’s welcoming, collaborative, and centered around
      quality.


      we’re honored to be part of your journey and look forward to creating
      something truly unforgettable.
